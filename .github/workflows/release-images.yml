name: Public Immutable Image Build

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release identifier (not latest)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-image-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: medok33

jobs:
  public-image-build:
    name: Public Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out exact public revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve immutable candidate identity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          release_id='${{ inputs.release_id }}'
          if ! [[ "$release_id" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{2,127}$ ]] || [[ "$release_id" == latest ]]; then
            echo 'release_id must be an immutable non-latest identifier' >&2
            exit 1
          fi
          sha='${{ github.sha }}'
          short_sha="${sha:0:12}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "public_git_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check migration chain
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migrations
        run: pnpm db:check-migrations

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        id: web
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/medok33/weight-app-web:sha-${{ steps.candidate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/medok33/Weight-App-public
            org.opencontainers.image.revision=${{ steps.candidate.outputs.public_git_sha }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.release_id }}
            org.opencontainers.image.created=${{ steps.candidate.outputs.created_at }}
          build-args: |
            RELEASE_VERSION=${{ steps.candidate.outputs.release_id }}
            GIT_SHA=${{ steps.candidate.outputs.public_git_sha }}
            BUILD_TIMESTAMP=${{ steps.candidate.outputs.created_at }}
            OCI_SOURCE=https://github.com/medok33/Weight-App-public
          provenance: mode=max

      - name: Build and push API
        id: api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile.api
          target: api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/medok33/weight-app-api:sha-${{ steps.candidate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/medok33/Weight-App-public
            org.opencontainers.image.revision=${{ steps.candidate.outputs.public_git_sha }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.release_id }}
            org.opencontainers.image.created=${{ steps.candidate.outputs.created_at }}
          build-args: |
            RELEASE_VERSION=${{ steps.candidate.outputs.release_id }}
            GIT_SHA=${{ steps.candidate.outputs.public_git_sha }}
            BUILD_TIMESTAMP=${{ steps.candidate.outputs.created_at }}
            OCI_SOURCE=https://github.com/medok33/Weight-App-public
          provenance: mode=max

      - name: Build and push worker
        id: worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/medok33/weight-app-worker:sha-${{ steps.candidate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/medok33/Weight-App-public
            org.opencontainers.image.revision=${{ steps.candidate.outputs.public_git_sha }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.release_id }}
            org.opencontainers.image.created=${{ steps.candidate.outputs.created_at }}
          build-args: |
            RELEASE_VERSION=${{ steps.candidate.outputs.release_id }}
            GIT_SHA=${{ steps.candidate.outputs.public_git_sha }}
            BUILD_TIMESTAMP=${{ steps.candidate.outputs.created_at }}
            OCI_SOURCE=https://github.com/medok33/Weight-App-public
          provenance: mode=max

      - name: Build and push migration runner
        id: migrate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile.api
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ghcr.io/medok33/weight-app-migrate:sha-${{ steps.candidate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/medok33/Weight-App-public
            org.opencontainers.image.revision=${{ steps.candidate.outputs.public_git_sha }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.release_id }}
            org.opencontainers.image.created=${{ steps.candidate.outputs.created_at }}
          build-args: |
            RELEASE_VERSION=${{ steps.candidate.outputs.release_id }}
            GIT_SHA=${{ steps.candidate.outputs.public_git_sha }}
            BUILD_TIMESTAMP=${{ steps.candidate.outputs.created_at }}
            OCI_SOURCE=https://github.com/medok33/Weight-App-public
          provenance: mode=max

      - name: Write immutable release manifest
        env:
          RELEASE_ID: ${{ steps.candidate.outputs.release_id }}
          PUBLIC_GIT_SHA: ${{ steps.candidate.outputs.public_git_sha }}
          CREATED_AT: ${{ steps.candidate.outputs.created_at }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
        run: |
          node -e "const fs=require('node:fs'); const e=process.env; fs.writeFileSync('weight-app-public-release-manifest.json', JSON.stringify({releaseId:e.RELEASE_ID, publicGitSha:e.PUBLIC_GIT_SHA, createdAt:e.CREATED_AT, buildWorkflowRunId:e.GITHUB_RUN_ID, images:{web:{repository:'ghcr.io/medok33/weight-app-web',digest:e.WEB_DIGEST},api:{repository:'ghcr.io/medok33/weight-app-api',digest:e.API_DIGEST},worker:{repository:'ghcr.io/medok33/weight-app-worker',digest:e.WORKER_DIGEST},migrate:{repository:'ghcr.io/medok33/weight-app-migrate',digest:e.MIGRATE_DIGEST}}}, null, 2)+'\\n')"

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weight-app-public-release-manifest
          path: weight-app-public-release-manifest.json
          if-no-files-found: error
