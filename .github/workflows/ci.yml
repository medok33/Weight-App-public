            if curl -sf http://localhost:3000/ >/dev/null; then
              echo "Web live after ${i}s"
              break
            fi
            if ! kill -0 "$(cat /tmp/weight-web.pid)" 2>/dev/null; then
              echo "Web process died; log:"
              cat /tmp/weight-web.log
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "Web did not become live; log:"
              cat /tmp/weight-web.log
              exit 1
            fi
          done

          echo "==== Running Activity E2E (test:e2e:activity) ===="
          set +e
          pnpm --dir apps/web test:e2e:activity
          status_activity=$?
          set -e
          if [ "$status_activity" -ne 0 ]; then
            echo "==== API log (tail) ===="
            tail -n 200 /tmp/weight-api.log || true
            echo "==== Web log (tail) ===="
            tail -n 200 /tmp/weight-web.log || true
          fi
          kill "$(cat /tmp/weight-web.pid)" 2>/dev/null || true
          kill "$(cat /tmp/weight-api.pid)" 2>/dev/null || true
          exit "$status_activity"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: activity-e2e-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
